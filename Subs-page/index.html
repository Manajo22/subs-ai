<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscription plans</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
  @view-transition { navigation: auto; }
body {
  background:#050507; min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:30px 16px;
}
.phone {
  position:relative; width:384px; height:822px; border-radius:46px;
  background:#0a0a0d; border:1.5px solid rgba(255,255,255,0.13);
  box-shadow:0 0 0 4px rgba(255,255,255,0.03), 0 40px 90px rgba(0,0,0,0.9);
  padding:12px; flex-shrink:0;
}
.screen {
  position:relative; width:360px; height:798px; border-radius:36px;
  overflow:hidden; background:#0F1014;
}
/* SUBS PAGE */
.subs-page { position:absolute; inset:0; overflow:hidden;
  transition:transform .45s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
.subs-page.exit { transform:translateX(-36px); opacity:0; pointer-events:none; }
.bg-svg { position:absolute; top:0; left:0; width:360px; height:798px;
  z-index:0; pointer-events:none; user-select:none; }
.scroll-area { position:absolute; top:158px; left:0; right:0; bottom:143px;
  overflow-y:auto; overflow-x:hidden; z-index:10;
  scrollbar-width:none; -ms-overflow-style:none; }
.scroll-area::-webkit-scrollbar { display:none; }
.items-svg { display:block; width:336px; margin:0 auto; height:auto; }
/* transparent click target over the bg Help pill */
.help-hit { position:absolute; top:46px; right:13px; width:67px; height:31px;
  z-index:40; cursor:pointer; background:transparent; border:none; padding:0;
  border-radius:15px;
  transition:background .15s ease, box-shadow .15s ease, transform .12s ease; }
.help-hit:hover { background:rgba(255,255,255,0.10); box-shadow:0 0 16px rgba(255,255,255,0.12); }
.help-hit:active { background:rgba(255,255,255,0.16); transform:scale(0.97); }
.continue-tab { position:absolute; bottom:0; left:0; right:0; width:360px;
  z-index:50; pointer-events:none; }
.continue-tab img { display:block; width:360px; height:auto; }

</style>
</head>
