  /* scrollable question list — sits behind the submit bar, clipped below the
     baked status-bar/arrow zone so nothing scrolls over the header */
  .scroll {
    position:absolute; top:88px; left:0; right:0; bottom:0; z-index:10;
    overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none; -ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;
  }
  .scroll::-webkit-scrollbar { display:none; }
  .scroll-inner {
    width:360px;
    padding-bottom:150px; /* lets the last card clear the glass + submit bar */
  }

  /* selected-state overlays + ticks: hidden until chosen */
  .ovl, .tick { opacity:0; pointer-events:none; transition:opacity .18s ease; }
  .ovl { transform-box:fill-box; transform-origin:center; }
  .ovl.on  { opacity:1; animation:pop .26s cubic-bezier(.34,1.56,.64,1); }
  .tick.on { opacity:1; }
  @keyframes pop { 0%{transform:scale(.93)} 60%{transform:scale(1.03)} 100%{transform:scale(1)} }
  .hot { cursor:pointer; -webkit-tap-highlight-color:transparent; }

  /* back arrow hotspot (arrow itself is part of bg.jpg) */
  .back-hit {
    position:absolute; top:34px; left:14px; width:44px; height:44px; z-index:55;
    background:transparent; border:none; cursor:pointer; border-radius:50%;
    transition:background .15s ease, transform .12s ease;
  }
  .back-hit:hover { background:rgba(255,255,255,0.08); }
  .back-hit:active { background:rgba(255,255,255,0.14); transform:scale(.94); }

  /* ---------- liquid-glass band above the Submit button ----------
     A fixed, non-interactive layer that blurs the list scrolling behind it.
     The mask makes the blur strongest near the button and fade to clear higher
     up, so cards dissolve into frosted glass right before they reach Submit. */
  .glass {
    position:absolute; left:0; right:0; bottom:86px; height:118px; z-index:40;
    pointer-events:none;
    -webkit-backdrop-filter:blur(13px) saturate(118%);
            backdrop-filter:blur(13px) saturate(118%);
    background:linear-gradient(to top, rgba(15,16,20,0.62), rgba(15,16,20,0));
    -webkit-mask-image:linear-gradient(to top, #000 34%, transparent 100%);
            mask-image:linear-gradient(to top, #000 34%, transparent 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* fixed Submit bar (button + android nav baked into the svg) */
  .submit {
    position:absolute; left:0; bottom:0; width:360px; height:100px; z-index:50;
    pointer-events:none;
  }
  .submit svg { width:360px; height:100px; }
  /* transparent click target over just the Submit button (top portion) */
  .submit-hit {
    position:absolute; left:12px; right:12px; bottom:44px; height:44px; z-index:51;
    background:transparent; border:none; cursor:pointer; border-radius:22px;
    transition:transform .12s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .submit-hit:active { transform:scale(.985); background:rgba(0,0,0,0.06); }
</style>
</head>

<div class="phone">
  <div class="screen">

    <div class="bg"></div>

<script>
  // single-select per question: tapping a card lights its overlay (hiding the
  // others in that question) and turns the question's timeline node into a tick.
  const selections = {};
  document.querySelectorAll('.hot').forEach(hot => {
    hot.addEventListener('click', () => {
      const q = hot.dataset.q;
      const grp = hot.dataset.grp;
      // clear other overlays in the same question
      document.querySelectorAll('.ovl[data-q="' + q + '"]').forEach(o => o.classList.remove('on'));
      // light this one (re-trigger pop animation)
      const chosen = document.getElementById(grp);
      chosen.classList.remove('on'); void chosen.offsetWidth; chosen.classList.add('on');
      // show the question's tick
      const tick = document.getElementById('tick_' + q);
      if (tick) tick.classList.add('on');
      selections[q] = grp;
    });
  });

  document.getElementById('submitBtn').addEventListener('click', () => {
    console.log('Submitted selections:', selections);
  });

  // back arrow -> return to the page that opened this (index)
  document.getElementById('backBtn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = '../Subs-page/index.html';
  });
</script>
